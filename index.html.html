    const calculateDiffDays = (pastDateStr) => {
      if (!pastDateStr) return 999;
      const past = new Date(pastDateStr);
      const now = new Date();
      const diffTime = Math.abs(now.getTime() - past.getTime());
      return Math.floor(diffTime / (1000 * 60 * 60 * 24));
    };

    const getRemainingDays = (task) => {
      if (task.type === 'single' && task.completed) return 99999;

      const today = new Date();
      today.setHours(0, 0, 0, 0);

      if (task.type === 'single') {
        if (!task.dueDate) return 9990;
        const due = new Date(task.dueDate);
        due.setHours(0, 0, 0, 0);
        return Math.round((due.getTime() - today.getTime()) / (1000 * 60 * 60 * 24));
      }

      if (task.type === 'cycle') {
        if (!task.lastDoneDate) return -task.cycleDays;
        const last = new Date(task.lastDoneDate);
        last.setHours(0, 0, 0, 0);
        const dueTime = last.getTime() + task.cycleDays * 86400000;
        return Math.round((dueTime - today.getTime()) / (1000 * 60 * 60 * 24));
      }

      if (task.type === 'monthly') {
        const currentYear = today.getFullYear();
        const currentMonth = today.getMonth();
        const currentDay = today.getDate();
        const fixedDay = Math.min(31, Math.max(1, task.fixedDay || 1));

        let targetDate = new Date(currentYear, currentMonth, fixedDay);
        targetDate.setHours(0, 0, 0, 0);

        if (currentDay > fixedDay) {
          if (task.lastDoneDate) {
            const last = new Date(task.lastDoneDate);
            if (last.getFullYear() === currentYear && last.getMonth() === currentMonth) {
              targetDate = new Date(currentYear, currentMonth + 1, fixedDay);
            }
          }
        } else if (task.lastDoneDate) {
          const last = new Date(task.lastDoneDate);
          if (last.getFullYear() === currentYear && last.getMonth() === currentMonth) {
            targetDate = new Date(currentYear, currentMonth + 1, fixedDay);
          }
        }
        return Math.round((targetDate.getTime() - today.getTime()) / (1000 * 60 * 60 * 24));
      }

      return 9990;
    };

          sorted: mergedList,
          todayRank: todayRank > 0 ? todayRank : 1,
          totalDaysRecorded,
          nextRankExpNeeded,
          nextTargetRank,
          leadExp,
          pastAverage,
          growthRate
        };
      }, [dailyExpHistory, todayExpGained]);

      // レベル進捗計算
      const currentLevelInfo = useMemo(() => {
        let current = LEVEL_TITLES[0];
        let next = LEVEL_TITLES[1];

        for (let i = 0; i < LEVEL_TITLES.length; i++) {
          if (totalExp >= LEVEL_TITLES[i].minExp) {
            current = LEVEL_TITLES[i];
            next = LEVEL_TITLES[i + 1] || null;
          } else {
            break;
          }
        }

        const currentBase = current.minExp;
        const nextBase = next ? next.minExp : current.minExp + 1000;
        const progressPercent = next
          ? Math.min(100, Math.max(0, ((totalExp - currentBase) / (nextBase - currentBase)) * 100))
          : 100;

        return {
          level: current.level,
          title: current.title,
          progressPercent,
          nextMinExp: nextBase,
          currentMinExp: currentBase,
          dividendTitle: current.dividendTitle,
          dividendDetail: current.dividendDetail
        };
      }, [totalExp]);

      // EXP加算トリガー
      const triggerExpGain = (amount, label = 'EXP') => {
        const oldRank = rankingStats.todayRank;

        setTotalExp(prev => {
          const nextExp = Math.max(0, prev + amount);
          const oldLvl = getLevelObj(prev);
          const newLvl = getLevelObj(nextExp);

          if (newLvl.level > oldLvl.level && amount > 0) {
            setTimeout(() => {
              setLevelUpModalData({
                level: newLvl.level,
                title: newLvl.title,
                praise: newLvl.praise,
                dividendTitle: newLvl.dividendTitle,
                dividendDetail: newLvl.dividendDetail,
                reward: newLvl.rewardSuggestion
              });
              setCurrentRewardIndex(Math.floor(Math.random() * REWARD_IDEAS.length));
            }, 350);
          }
          return nextExp;
        });

        setTodayExpGained(prev => {
          const updatedTodayExp = Math.max(0, prev + amount);

          if (amount > 0) {
            setTimeout(() => {
              const today = getTodayString();
              const pastRecords = dailyExpHistory
                .filter(h => h.date !== today && h.expGained > 0)
                .sort((a, b) => b.expGained - a.expGained);

              const newMergedList = [
                { date: today, expGained: updatedTodayExp },
                ...pastRecords
              ].sort((a, b) => b.expGained - a.expGained);

              const newRank = newMergedList.findIndex(item => item.date === today) + 1;

              if (newRank < oldRank && oldRank > 1) {
                setRankUpNotification({
                  fromRank: oldRank,
                  toRank: newRank,
                  key: Date.now()
                });
                setTimeout(() => {
                  setRankUpNotification(null);
                }, 3200);
              }
            }, 50);
          }

          return updatedTodayExp;
        });

        setFloatingExp({ amount, label, key: Date.now() });
        setTimeout(() => {
          setFloatingExp(null);
        }, 1200);
      };

      // 累計マイルストーン判定
      const checkMilestones = (habit, newTotalCount) => {
        for (const m of MILESTONE_THRESHOLDS) {
          const milestoneKey = `${habit.id}_${m.count}`;
          if (newTotalCount >= m.count && !claimedMilestones[milestoneKey]) {
            setClaimedMilestones(prev => ({ ...prev, [milestoneKey]: true }));
            triggerExpGain(m.bonus, `🏆金字塔ボーナス +${m.bonus}`);
            setTimeout(() => {
              setMilestoneCelebration({
                habitName: habit.name,
                emoji: habit.emoji,
                count: m.count,
                title: m.title,
                bonus: m.bonus
              });
            }, 400);
            break;
          }
        }
      };

      const openMotivationBooster = () => {
        const randomDividend = AD_LIB_DIVIDENDS[Math.floor(Math.random() * AD_LIB_DIVIDENDS.length)];
        setActiveDividend(randomDividend);
        setShowMotivationModal(true);
      };

      const cycleRewardIdea = () => {
        setCurrentRewardIndex(prev => (prev + 1) % REWARD_IDEAS.length);
      };

      const handleHabitIncrement = (id, isBonus = false) => {
        setHabits(prev =>
          prev.map(item => {
            if (item.id === id) {
              const expGain = isBonus ? item.exp + item.bonusExp : item.exp;
              const newTotal = item.totalCount + 1;
              triggerExpGain(expGain, isBonus ? `⚡ボーナス +${expGain}` : `+${expGain}`);
              checkMilestones(item, newTotal);
              return {
                ...item,
                countToday: item.countToday + 1,
                bonusToday: isBonus ? item.bonusToday + 1 : item.bonusToday,
                totalCount: newTotal,
                lastUpdated: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
              };
            }
            return item;
          })
        );
      };

      const moveHabit = (index, direction) => {
        const targetIndex = index + direction;
        if (targetIndex < 0 || targetIndex >= habits.length) return;
        const newHabits = [...habits];
        const temp = newHabits[index];
        newHabits[index] = newHabits[targetIndex];
        newHabits[targetIndex] = temp;
        setHabits(newHabits);
      };

      const completeMaintenanceTask = (id) => {
        setMaintenance(prev =>
          prev.map(task => {
            if (task.id === id) {
              triggerExpGain(task.exp, `✨完了 +${task.exp}`);
              if (task.type === 'single') {
                return { ...task, completed: true, totalCount: (task.totalCount || 0) + 1 };
              }
              return {
                ...task,
                lastDoneDate: getTodayString(),
                totalCount: (task.totalCount || 0) + 1
              };
            }
            return task;
          })
        );
      };

      const deleteMaintenanceTask = (id) => {
        setMaintenance(prev => prev.filter(t => t.id !== id));
      };

      const handleSaveMaintenance = (savedTask) => {
        if (!savedTask.id) {
          const newTask = {
            ...savedTask,
            id: 'm-' + Date.now(),
            lastDoneDate: savedTask.lastDoneDate || getTodayString(),
            totalCount: savedTask.totalCount || 0,
            completed: savedTask.type === 'single' ? false : undefined
          };
          setMaintenance(prev => [newTask, ...prev]);
        } else {
          setMaintenance(prev =>
            prev.map(t => (t.id === savedTask.id ? { ...t, ...savedTask } : t))
          );
        }
        setEditingMaintenance(null);
      };

      // 突発ログの記録
      const addAdhocLog = (name, emoji, exp) => {
        const newLog = {
          id: 'adhoc-' + Date.now(),
          name,
          emoji: emoji || '🌟',
          exp: Number(exp) || 15,
          timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
        };
        setAdhocLogs(prev => [newLog, ...prev]);
        triggerExpGain(newLog.exp, `突発ログ +${newLog.exp}`);
      };

      const handleCustomAdhocSubmit = (e) => {
        e.preventDefault();
        if (!customAdhocText.trim()) return;
        addAdhocLog(customAdhocText.trim(), customAdhocEmoji || '📝', Number(customAdhocExp) || 15);
        setCustomAdhocText('');
      };

      // 突発ログ編集
      const handleSaveAdhocEdit = (e) => {
        e.preventDefault();
        if (!editingAdhocLog || !editingAdhocLog.name.trim()) return;

        const oldExp = editingAdhocLog._originalExp ?? editingAdhocLog.exp;
        const newExp = Number(editingAdhocLog.exp) || 15;
        const expDiff = newExp - oldExp;

        setAdhocLogs(prev =>
          prev.map(item =>
            item.id === editingAdhocLog.id
              ? {
                  ...item,
                  name: editingAdhocLog.name.trim(),
                  emoji: editingAdhocLog.emoji || '📝',
                  exp: newExp
                }
              : item
          )
        );

        if (expDiff !== 0) {
          triggerExpGain(expDiff, expDiff > 0 ? `修正補正 +${expDiff}` : `修正補正 ${expDiff}`);
        }

        setEditingAdhocLog(null);
      };

      const handleConfirmDeleteAdhoc = () => {
        if (!deletingAdhocLog) return;
        const expToDeduct = deletingAdhocLog.exp || 0;

        setAdhocLogs(prev => prev.filter(l => l.id !== deletingAdhocLog.id));
        if (expToDeduct > 0) {
          triggerExpGain(-expToDeduct, `ログ削除 -${expToDeduct}`);
        }
        setDeletingAdhocLog(null);
      };

      // ★ 突発ログ・テンプレートの保存（編集＆新規追加）
      const handleSaveTemplateItem = (e) => {
        e.preventDefault();
        if (!editingTemplateItem || !editingTemplateItem.name.trim()) return;

        const categoryName = editingTemplateItem.category.trim() || 'その他・日常';
        const itemObj = {
          id: editingTemplateItem.id || 't-' + Date.now(),
          name: editingTemplateItem.name.trim(),
          emoji: editingTemplateItem.emoji || '📝',
          exp: Number(editingTemplateItem.exp) || 15
        };

        setAdhocTemplates(prev => {
          // 既存カテゴリを探す
          const catIndex = prev.findIndex(c => c.category === categoryName);
          let newTemplates = JSON.parse(JSON.stringify(prev));

          if (editingTemplateItem.isNew) {
            // 新規追加
            if (catIndex >= 0) {
              newTemplates[catIndex].items.push(itemObj);
            } else {
              newTemplates.push({
                category: categoryName,
                items: [itemObj]
              });
            }
          } else {
            // 既存編集
            // まず元のカテゴリから削除
            newTemplates = newTemplates.map(c => ({
              ...c,
              items: c.items.filter(it => it.id !== itemObj.id)
            }));

            // 指定のカテゴリに追加
            const targetCatIdx = newTemplates.findIndex(c => c.category === categoryName);
            if (targetCatIdx >= 0) {
              newTemplates[targetCatIdx].items.push(itemObj);
            } else {
              newTemplates.push({
                category: categoryName,
                items: [itemObj]
              });
            }
          }

          // 空になったカテゴリを除去
          return newTemplates.filter(c => c.items.length > 0);
        });

        setEditingTemplateItem(null);
      };

      // ★ 突発ログ・テンプレートの削除
      const handleDeleteTemplateItem = (itemId) => {
        setAdhocTemplates(prev =>
          prev
            .map(c => ({
              ...c,
              items: c.items.filter(it => it.id !== itemId)
            }))
            .filter(c => c.items.length > 0)
        );
        setEditingTemplateItem(null);
      };

      // ★ 突発ログ・テンプレートを初期状態にリセット
      const handleResetTemplates = () => {
        if (window.confirm('テンプレートを初期プリセットに戻しますか？（ご自身で追加・編集したテンプレはリセットされます）')) {
          setAdhocTemplates(DEFAULT_ADHOC_TEMPLATES);
          setIsTemplateEditMode(false);
        }
      };

      // AI提案
      const filteredAiSuggestions = useMemo(() => {
        if (aiCategoryFilter === 'all') return AI_AD_HOC_SUGGESTIONS;
        return AI_AD_HOC_SUGGESTIONS.filter(s => s.category === aiCategoryFilter);
      }, [aiCategoryFilter]);

      const currentAiSuggestion = useMemo(() => {
        if (filteredAiSuggestions.length === 0) return AI_AD_HOC_SUGGESTIONS[0];
        return filteredAiSuggestions[aiSuggestionIndex % filteredAiSuggestions.length];
      }, [filteredAiSuggestions, aiSuggestionIndex]);

      const nextAiSuggestion = () => {
        setAiSuggestionIndex(prev => prev + 1);
      };

      const adoptAiSuggestion = (sug) => {
        addAdhocLog(sug.title, sug.emoji, sug.exp);
        nextAiSuggestion();
      };

      const todayQuests = useMemo(() => {
        const day = new Date().getDate();
        const q1 = DAILY_QUEST_POOL[(day) % DAILY_QUEST_POOL.length];
        const q2 = DAILY_QUEST_POOL[(day + 3) % DAILY_QUEST_POOL.length];
        return [q1, q2];
      }, []);

      const completeQuest = (quest) => {
        if (completedQuests.includes(quest.id)) return;
        setCompletedQuests(prev => [...prev, quest.id]);
        triggerExpGain(quest.bonusExp, `🎯クエスト達成 +${quest.bonusExp}`);
      };

      const availableSuggestion = useMemo(() => {
        return RULE_SUGGESTIONS.find(
          s => totalExp >= s.triggerExp && !adoptedSuggestions.includes(s.id)
        );
      }, [totalExp, adoptedSuggestions]);

      const adoptRuleSuggestion = (sug) => {
        const newHabit = {
          id: 'h-' + Date.now(),
          ...sug.habit,
          countToday: 0,
          bonusToday: 0,
          totalCount: 0,
          lastUpdated: ''
        };
        setHabits(prev => [newHabit, ...prev]);
        setAdoptedSuggestions(prev => [...prev, sug.id]);
        triggerExpGain(30, '🎉新ルール採用 +30');
        setActiveTab('habits');
      };

      const sortedHabits = useMemo(() => {
        if (!filterUncompleted) return habits;
        return [...habits].sort((a, b) => {
          const aDone = a.countToday > 0 ? 1 : 0;
          const bDone = b.countToday > 0 ? 1 : 0;
          return aDone - bDone;
        });
      }, [habits, filterUncompleted]);

      const sortedMaintenance = useMemo(() => {
        const list = maintenance.map(task => ({
          ...task,
          _remainingDays: getRemainingDays(task)
        }));

        return list.sort((a, b) => {
          const aCompleted = a.type === 'single' && a.completed;
          const bCompleted = b.type === 'single' && b.completed;
          if (aCompleted && !bCompleted) return 1;
          if (!aCompleted && bCompleted) return -1;
          return a._remainingDays - b._remainingDays;
        });
      }, [maintenance]);

      // 配当確定報告書の自動生成
      const generateSelfEsteemReport = () => {
        const completedHabitList = habits.filter(h => h.countToday > 0);
        const totalTodayCounts = habits.reduce((acc, cur) => acc + cur.countToday, 0);
        const today = new Date();
        const dateStr = `${today.getFullYear()}年${today.getMonth() + 1}月${today.getDate()}日`;

        let report = `🌟 【自己肯定感＆実生活配当 確定報告書】 🌟\n`;
        report += `📅 日付: ${dateStr}\n`;
        report += `👑 現在の境地: Lv.${currentLevelInfo.level}「${currentLevelInfo.title}」 (累計 ${totalExp} EXP)\n`;
        report += `🔥 継続記録: 連続 ${streak.current} 日達成中！ (最高: ${streak.best} 日)\n`;
        report += `📈 本日の行動力スコア: ${todayExpGained} EXP ➜ 歴代ランキング第 ${rankingStats.todayRank} 位 / 全${rankingStats.totalDaysRecorded}日中！\n`;
        if (rankingStats.growthRate !== 0) {
          report += `  └ 過去平均比: ${rankingStats.growthRate > 0 ? '+' : ''}${rankingStats.growthRate}% の行動力進化！\n`;
        }
        report += `────────────────────────────\n\n`;

        report += `🔥 【本日積み上げた偉業（計 ${totalTodayCounts} 回）】\n`;
        if (completedHabitList.length === 0) {
          report += `・息をして今日を生き抜いたこと自体が、全生命システム維持の100点満点大ファインプレー！\n`;
        } else {
          completedHabitList.forEach(h => {
            report += `・${h.emoji} ${h.name} × ${h.countToday}回（通算累計: ${h.totalCount}回目）\n`;
            if (h.bonusToday > 0) {
              report += `  └ ⚡ 条件ボーナス達成: 「${h.bonusText}」 × ${h.bonusToday}回！\n`;
            }
          });
        }

        if (adhocLogs.length > 0) {
          report += `\n⚡ 【突発的な奮闘＆臨機応変ログ（計 ${adhocLogs.length} 件）】\n`;
          adhocLogs.forEach(l => {
            report += `・${l.emoji} ${l.name} (${l.timestamp}) [+${l.exp} EXP]\n`;
          });
        }

        if (completedQuests.length > 0) {
          report += `\n🎯 【クリアした日替わり特別クエスト】\n`;
          todayQuests.forEach(q => {
            if (completedQuests.includes(q.id)) {
              report += `・${q.emoji} ${q.text}\n`;
            }
          });
        }

        report += `\n🧬 【本日発生した具体的な実生活・身体配当（リアルリターン）】\n`;
        if (completedHabitList.length > 0) {
          completedHabitList.slice(0, 3).forEach((h, idx) => {
            const div = getHabitDividend(h);
            report += `[配当${idx + 1}] 「${div.dividendTitle}」\n  ➜ ${div.dividendDesc}\n\n`;
          });
        } else {
          report += `[配当] 「生存維持＆自律神経セーフティ配当」\n  ➜ 休息と生存そのものが副交感神経を修復し、明日へ向けた生体エネルギーを充電しています。\n\n`;
        }

        report += `💖 【総括メッセージ】\n`;
        report += `過去のどの自分と比べても、今日あなたが一歩一歩刻んだ経験値は本物です。\n`;
        report += `「継続日数」と「累計回数」の複利効果により、あなたの脳・肉体・住空間は確実にアップグレードされています。\n`;
        report += `胸を張って自分を熱烈に称賛し、今夜は極上の休息をとってください！お疲れ様でした✨`;

        return report;
      };

      const copyReportToClipboard = () => {
        const text = generateSelfEsteemReport();
        try {
          const textarea = document.createElement('textarea');
          textarea.value = text;
          textarea.style.position = 'fixed';
          textarea.style.left = '-9999px';
          document.body.appendChild(textarea);
          textarea.focus();
          textarea.select();
          document.execCommand('copy');
          document.body.removeChild(textarea);
          setCopyFeedback(true);
          setTimeout(() => setCopyFeedback(false), 2000);
        } catch (e) {
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(() => {
              setCopyFeedback(true);
              setTimeout(() => setCopyFeedback(false), 2000);
            });
          }
        }
      };

      const exportDataAsJSON = () => {
        const today = getTodayString();
        const currentHistory = [
          {
            date: today,
            expGained: todayExpGained,
            recordedAt: new Date().toISOString()
          },
          ...dailyExpHistory.filter(h => h.date !== today)
        ];

        const data = {
          schemaVersion: CURRENT_SCHEMA_VERSION,
          appVersion: APP_VERSION,
          totalExp,
          todayExpGained,
          dailyExpHistory: currentHistory,
          streak,
          claimedMilestones,
          habits,
          maintenance,
          adhocLogs,
          adhocTemplates,
          completedQuests,
          adoptedSuggestions,
          lastActiveDate,
          exportedAt: new Date().toISOString()
        };
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `self-esteem-habit-backup-${getTodayString()}.json`;
        a.click();
        URL.revokeObjectURL(url);
      };

      const handleImportJSON = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (evt) => {
          try {
            const parsed = JSON.parse(evt.target.result);
            const migrated = migrateImportedData(parsed);

            setTotalExp(migrated.totalExp);
            setTodayExpGained(migrated.todayExpGained);
            setDailyExpHistory(migrated.dailyExpHistory);
            setStreak(migrated.streak);
            setClaimedMilestones(migrated.claimedMilestones);
            setHabits(migrated.habits);
            setMaintenance(migrated.maintenance);
            setAdhocLogs(migrated.adhocLogs);
            setAdhocTemplates(migrated.adhocTemplates || DEFAULT_ADHOC_TEMPLATES);
            setCompletedQuests(migrated.completedQuests);
            setAdoptedSuggestions(migrated.adoptedSuggestions);
            setLastActiveDate(migrated.lastActiveDate);

            setShowSettingsModal(false);
            setUpgradeBannerText(`🎉 以前の記録（${migrated.totalExp} EXP・${migrated.habits.length}件の習慣・カスタムテンプレ等）を引き継ぎ、最新版に復元しました！`);
            setTimeout(() => setUpgradeBannerText(''), 6000);
            triggerExpGain(25, '最新仕様へ昇格復元！');
          } catch (err) {
            console.error('Import parse error:', err);
            alert('JSONファイルの読み込みに失敗しました。正しいバックアップファイルを選択してください。');
          }
        };
        reader.readAsText(file);
      };

      const exportHTMLFile = () => {
        const htmlContent = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
        const blob = new Blob([htmlContent], { type: 'text/html;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'index.html';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      };

      return (
        <div className="flex flex-col min-h-[100dvh] bg-slate-900 text-slate-100 font-sans antialiased select-none pb-[calc(env(safe-area-inset-bottom)+88px)]">
          
          {/* EXP獲得・調整時のフローティング演出 */}
          {floatingExp && (
            <div 
              key={floatingExp.key} 
              className="fixed top-20 left-1/2 -translate-x-1/2 z-50 pointer-events-none animate-bounce"
            >
              <div className={`text-slate-950 font-black text-sm px-4 py-1.5 rounded-full shadow-lg flex items-center gap-1.5 border-2 border-white ${
                floatingExp.amount < 0 ? 'bg-rose-400 shadow-rose-400/40 text-white' : 'bg-amber-400 shadow-amber-400/40 text-slate-950'
              }`}>
                <Zap className="w-4 h-4 fill-current text-current" />
                <span>{floatingExp.label}</span>
              </div>
            </div>
          )}

          {/* 歴代順位リアルタイム浮上演出 */}
          {rankUpNotification && (
            <div
              key={rankUpNotification.key}
              className="fixed top-28 left-1/2 -translate-x-1/2 z-50 pointer-events-none animate-in fade-in zoom-in-95 duration-300 w-11/12 max-w-sm"
            >
              <div className="bg-gradient-to-r from-amber-400 via-orange-500 to-amber-300 text-slate-950 p-3 rounded-2xl shadow-2xl shadow-amber-400/50 border-2 border-white flex items-center gap-3">
                <div className="p-2 bg-slate-950 text-amber-300 rounded-xl shrink-0 font-black text-lg">
                  🏆
                </div>
                <div className="min-w-0 flex-1">
                  <div className="text-[10px] font-black uppercase tracking-wider text-slate-900">
                    REALTIME RANK UP!
                  </div>
                  <div className="text-xs font-black leading-tight text-slate-950 truncate">
                    歴代第 <span className="text-sm underline">{rankUpNotification.fromRank}位</span> ➜ 第 <span className="text-base font-extrabold text-white bg-slate-950 px-1.5 py-0.5 rounded-md">{rankUpNotification.toRank}位</span> に浮上！！
                  </div>
                  <div className="text-[10px] font-bold text-slate-800">
                    タスク完了で行動力レコードを更新中！🔥
                  </div>
                </div>
              </div>
            </div>

                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
</body>
